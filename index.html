<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff0df">

    <title>Pocket Arcade | آرکید جیبی</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/app.js" defer></script>
    <script src="js/billiards.js" defer></script>
    <script src="js/pingpong.js" defer></script>
    <script src="js/snake.js" defer></script>
    <script src="js/hockey.js" defer></script>
</head>

<body>

<div class="app-shell">

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">✦</div>

            <div>
                <h1>Pocket Arcade</h1>
                <p>آرکید جیبی</p>
            </div>
        </div>

        <button id="themeToggle" class="theme-button" aria-label="تغییر تم">
            🌙
        </button>
    </header>

    <main>

        <section class="hero clay">
            <div>
                <span class="eyebrow">ARCADE CLUB</span>
                <h2>وقت بازیه! 🎮</h2>
                <p>بازی موردعلاقه‌ات رو انتخاب کن.</p>
            </div>

            <div class="hero-shape">✹</div>
        </section>

        <section class="game-grid" id="gameGrid">

            <button class="game-card clay" data-game="billiards">
                <div class="game-art pool-art">
                    <span class="pool-ball ball-eight">8</span>
                    <span class="small-ball small-ball-one"></span>
                    <span class="small-ball small-ball-two"></span>
                </div>

                <h3>بیلیارد</h3>
                <p>نشانه‌گیری و ضربه</p>

                <span class="play-label">بازی کن ←</span>
            </button>

            <button class="game-card clay" data-game="pingpong">
                <div class="game-art ping-art">
                    <span class="racket-art"></span>
                    <span class="ping-ball-art"></span>
                </div>

                <h3>پینگ‌پنگ</h3>
                <p>رالی با حریف هوشمند</p>

                <span class="play-label">بازی کن ←</span>
            </button>

            <button class="game-card clay" data-game="snake">
                <div class="game-art snake-art">
                    <span class="snake-art-symbol">〰</span>
                    <span class="snake-art-dot"></span>
                </div>

                <h3>مار مینیمال</h3>
                <p>جمع کن و رشد کن</p>

                <span class="play-label">بازی کن ←</span>
            </button>

            <button class="game-card clay" data-game="hockey">
                <div class="game-art hockey-art">
                    <span class="hockey-art-puck"></span>
                    <span class="hockey-art-mallet mallet-one"></span>
                    <span class="hockey-art-mallet mallet-two"></span>
                </div>

                <h3>هاکی رومیزی</h3>
                <p>گل بزن و برنده شو</p>

                <span class="play-label">بازی کن ←</span>
            </button>

        </section>

        <section class="record-card clay">
            <span class="record-icon">🏆</span>

            <div>
                <strong>رکوردهای تو</strong>
                <p>بهترین امتیازت رو ثبت کن.</p>
            </div>

            <strong id="totalRecord">۰</strong>
        </section>

        <section class="play-screen clay hidden" id="playScreen">

            <header class="play-header">

                <button id="backButton" class="back-button">
                    ← بازگشت
                </button>

                <div class="play-title">
                    <span class="eyebrow" id="gameKicker">ARCADE</span>
                    <h2 id="gameHeading">بازی</h2>
                </div>

                <div class="score-card">
                    <span>امتیاز</span>
                    <strong id="score">۰</strong>
                </div>

            </header>

            <div class="canvas-wrap">
                <canvas id="gameCanvas" width="900" height="600"></canvas>

                <div class="canvas-hint" id="canvasHint">
                    برای شروع لمس کن
                </div>
            </div>

            <div class="game-controls" id="gameControls"></div>

            <div class="mobile-controls hidden" id="mobileControls">
                <button data-dir="up">▲</button>

                <div>
                    <button data-dir="left">◀</button>
                    <button data-dir="down">▼</button>
                    <button data-dir="right">▶</button>
                </div>
            </div>

            <footer class="play-footer">
                <span id="gameMessage">آماده‌ای؟</span>

                <button id="restartButton" class="primary-button">
                    شروع دوباره ↻
                </button>
            </footer>

        </section>

    </main>

    <footer class="app-footer">
        Pocket Arcade · بازی کن، رکورد بزن!
    </footer>

</div>

</body>
</html>
